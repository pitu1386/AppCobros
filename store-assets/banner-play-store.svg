<svg width="1024" height="500" viewBox="0 0 1024 500" version="1.1" xmlns="http://www.w3.org/2000/svg">

  <!-- Fondo -->
  <rect width="1024" height="500" fill="#221C44"/>

  <!-- Degradado decorativo derecha -->
  <ellipse cx="820" cy="250" rx="320" ry="320" fill="#3A3370" opacity="0.4"/>
  <ellipse cx="900" cy="420" rx="180" ry="180" fill="#0FA36B" opacity="0.12"/>

  <!-- Círculo decorativo izquierda -->
  <circle cx="80" cy="80" r="120" fill="#3A3370" opacity="0.25"/>
  <circle cx="0" cy="420" r="140" fill="#FFB547" opacity="0.07"/>

  <!-- ── Ícono de la app ── -->
  <rect x="80" y="140" width="200" height="200" rx="40" ry="40" fill="#2E2660"/>
  <!-- Renglones de libreta -->
  <rect x="112" y="188" width="136" height="12" rx="6" fill="white" opacity="0.8"/>
  <rect x="112" y="210" width="100" height="10" rx="5" fill="white" opacity="0.5"/>
  <rect x="112" y="228" width="118" height="10" rx="5" fill="white" opacity="0.5"/>
  <!-- Moneda -->
  <circle cx="180" cy="294" r="40" fill="#FFB547"/>
  <circle cx="180" cy="294" r="31" fill="#2E2660"/>
  <text x="180" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFB547">$</text>
  <!-- Tilde verde -->
  <polyline points="208,274 220,294 248,258" stroke="#0FA36B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- ── Textos ── -->
  <!-- Nombre principal -->
  <text x="330" y="230" font-family="Arial, sans-serif" font-size="62" font-weight="bold" fill="white">Libreta de Cobros</text>

  <!-- Subtítulo -->
  <text x="333" y="285" font-family="Arial, sans-serif" font-size="26" fill="#B7B3D9">Gestioná tus cobros mensuales de forma simple</text>

  <!-- Separador -->
  <rect x="333" y="310" width="60" height="4" rx="2" fill="#FFB547"/>

  <!-- Bullets de funciones -->
  <circle cx="343" cy="352" r="5" fill="#0FA36B"/>
  <text x="358" y="358" font-family="Arial, sans-serif" font-size="20" fill="#DEDCEE">Clientes y grupos organizados</text>

  <circle cx="343" cy="388" r="5" fill="#0FA36B"/>
  <text x="358" y="394" font-family="Arial, sans-serif" font-size="20" fill="#DEDCEE">Recordatorios por WhatsApp</text>

  <circle cx="343" cy="424" r="5" fill="#0FA36B"/>
  <text x="358" y="430" font-family="Arial, sans-serif" font-size="20" fill="#DEDCEE">Historial de pagos y deudas</text>

  <!-- Badge "Gratis" -->
  <rect x="840" y="400" width="120" height="44" rx="22" fill="#0FA36B"/>
  <text x="900" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">GRATIS</text>

</svg>
